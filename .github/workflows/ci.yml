name: CI Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/vagran/pulse-build:latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release, MinSizeRel]

    name: Tutorial cross-compilation ${{ matrix.compiler }}-${{ matrix.build_type }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set build directory
        run: echo "BUILD_DIR=build/${{ matrix.compiler }}-${{ matrix.build_type }}" >> $GITHUB_ENV

      - name: Configure
        run: >
          cmake -S . -B $BUILD_DIR
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=$PWD/arm-${{ matrix.compiler }}-toolchain.cmake

      - name: Build
        run: cmake --build $BUILD_DIR --target all
